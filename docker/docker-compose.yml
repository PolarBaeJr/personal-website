# Personal site: Raspberry Pi deployment
#
#   ./docker/deploy.sh                    # from your Mac: sync, build, start
#   cd docker && docker compose up -d --build   # on the Pi
#
# Routed by proxy-manager via the labels below. No nginx config needed.

# Explicit project name: without it compose names the project after this
# folder ("docker"), which other apps on the Pi share, and --remove-orphans
# would delete their containers.
name: personal-page

networks:
  edge:
    external: true

volumes:
  personal-page-data:
    name: personal-page-data

services:
  personal-page:
    # Built by .github/workflows/build-image.yml on every push to main; the
    # dashboard auto-updates the container when a new digest appears.
    # `deploy.sh --build` builds it on the Pi instead.
    image: ghcr.io/polarbaejr/personal-website:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: personal-page
    restart: unless-stopped
    networks: [edge]

    # Secrets and keys live in ../.env, never in git (see ../.env.example):
    # PostHog, RESUME_API_TOKEN, RESUME_PHONE, RESUME_ADDRESS. RESUME_DB and
    # CONTENT_DB are pinned below to the data volume.
    env_file:
      - path: ../.env
        required: false
    environment:
      TZ: ${TZ:-America/Vancouver}
      RESUME_DB: /data/resume.db
      CONTENT_DB: /data/content.db

    # The dashboard's auto-update copies HostConfig.Mounts when it recreates
    # the container, but not HostConfig.Binds. Compose writes a plain named
    # volume as a Bind; giving it an option (nocopy) makes it a Mount, so the
    # volume survives auto-updates. nocopy only affects a brand-new empty
    # volume, which then needs `chown 1000 /data` (the entrypoint says so).
    volumes:
      - type: volume
        source: personal-page-data
        target: /data
        volume:
          nocopy: true

    labels:
      proxy.enable:     "true"
      proxy.host:       "matthewcheng.net"
      proxy.port:       "3000"
      proxy.service:    "personal-page"
      proxy.unscalable: "true"   # single instance (SQLite)
      proxy.health:     "/"
      proxy.name:       "Personal site"
      # Served (as a 503) while the host is in maintenance mode. The same file
      # backs the Cloudflare Worker in integrations/cloudflare-error-page.
      proxy.maintenance: "/app/public/503.html"
