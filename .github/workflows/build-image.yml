# Builds the site's arm64 image (for the Raspberry Pi) and pushes it to ghcr.
# The proxy-manager dashboard auto-updates the running container when a new
# :latest digest appears.
name: Build image

# Only build when something that ends up in the image changes. Every build
# gets a new digest (timestamps, Next build id) even for identical code, and
# the dashboard restarts the site for each new digest. Run it by hand from
# the Actions tab (workflow_dispatch) when needed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docker/deploy.sh"
      - "docker/pi.sh"
      - "docker/docker-compose.yml"
      - "integrations/**"
      - "mcp/**"
      - ".mcp.json"
      - ".github/**"
      - "**/*.md"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/polarbaejr/personal-website:latest
            ghcr.io/polarbaejr/personal-website:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
