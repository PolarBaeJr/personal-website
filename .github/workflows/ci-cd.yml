name: CI/CD

# One pipeline for the site:
#   checks  every push and pull request: lint, type-check, tests, the
#           project's banned-string rules, a full `next build`, and the MCP
#           server's type-check. Needs no secrets, so fork PRs run it too.
#   image   pushes to main only, after checks pass: builds the arm64 image
#           and pushes ghcr.io/polarbaejr/personal-website:latest. The
#           proxy-manager dashboard auto-updates the Pi when the digest
#           changes.
#
# Every image build gets a new digest even for identical code (timestamps,
# Next build id), and each new digest restarts the site. So the image job
# is skipped when a push only touches files that never reach the image:
# deploy scripts, compose, the Cloudflare Worker, the MCP server, CI and
# docs. "Run workflow" on the Actions tab always builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Cancel superseded PR runs; let main runs finish so no deploy is lost.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.changes.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        # PageProps/LayoutProps are generated into .next/types; a fresh
        # checkout has none until typegen (or a build) runs.
        run: npx next typegen && npx tsc --noEmit

      - name: Banned strings
        # Project rules: no clock or randomness calls in render code, no
        # arrow or middle-dot glyphs, no gradients, no all-caps styling.
        run: |
          pattern='new Date\(|Date\.now\(|Math\.random\(|[→←↑↓▾▸·]|gradient|text-transform|uppercase'
          if git ls-files -z src scripts mcp/src | xargs -0 grep -nIE "$pattern"; then
            echo "::error::Banned string found (see lines above)"
            exit 1
          fi

      - name: Journal scenarios
        run: npm run journal:check --if-present

      - name: Cloudflare Worker tests
        run: node --test integrations/cloudflare-error-page/worker.test.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: MCP server type-check
        run: npm ci --prefix mcp && npm run typecheck --prefix mcp

      - name: Decide whether the image needs rebuilding
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          skip='^(docker/(deploy|pi)\.sh|docker/docker-compose\.yml|integrations/.*|mcp/.*|\.mcp\.json|\.github/.*|.*\.md|\.env\.example)$'
          shipped=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -vE "$skip" || true)
          if [ -n "$shipped" ]; then
            echo "Files that reach the image:"; echo "$shipped"
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing that reaches the image changed; skipping the build."
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.checks.outputs.image == 'true'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/polarbaejr/personal-website:latest
            ghcr.io/polarbaejr/personal-website:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
